    <div class="container">
        <h1>צור קשר</h1>
        <div class="content-box">
            <p>יש לכם שאלה לגבי הספר או הפרויקט? השאירו פרטים ונחזור אליכם:</p>
            <form class="contact-form" onsubmit="event.preventDefault(); alert('ההודעה נשלחה בהצלחה!');">
                <label for="name">שם מלא:</label>
                <input type="text" id="name" placeholder="הכנס את שמך" required>

                <label for="email">אימייל:</label>
                <input type="email" id="email" placeholder="name@example.com" required>

                <label for="message">הודעה:</label>
                <textarea id="message" rows="4" placeholder="כתוב את הודעתך כאן..." required></textarea>

                <button type="submit">שלח הודעה</button>
            </form>
        </div>
    </div>
